<!doctype html>
<html lang="es">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wms-theme');
          if (t === 'dark' || (!t || t !== 'light')) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMS Multi-Tenant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
