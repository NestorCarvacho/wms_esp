services:
  db:
    image: mysql:8.0
    container_name: wms_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: wms_db
      MYSQL_ROOT_PASSWORD: root_password_segura
    ports:
      - "3307:3306"
    volumes:
      # Solo schema_completo.sql: evita ejecutar migraciones incrementales obsoletas.
      # Para recrear la BD desde cero: docker compose down -v && docker compose up -d
      - ./mysql-init/schema_completo.sql:/docker-entrypoint-initdb.d/01_schema_completo.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password_segura"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: .
    container_name: wms_api_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "mysql+aiomysql://root:root_password_segura@db:3306/wms_db"
      SECRET_KEY: tu_clave_secreta_para_jwt
      CORS_ORIGINS: "http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: wms_frontend
    restart: always
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  db_data: