# Fly.io — notification-service
# Desde la raíz del repo:
#   fly launch --no-deploy --config services/notification-service/fly.toml
#   fly secrets set DATABASE_URL=... SECRET_KEY=... REDIS_URL=... CORS_ORIGINS=...
#   fly deploy --config services/notification-service/fly.toml

app = "wms-notifications"
primary_region = "iad"

[build]
  dockerfile = "services/notification-service/Dockerfile"

[http_service]
  internal_port = 8010
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[env]
  NOTIFICATIONS_MODE = "local"
  DEBUG = "False"
